<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#210d1b">
  <title>Một lời chúc dành cho bạn</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #fff0f6;
      background: #210d1b;
    }
    .app {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
      padding: 28px 18px;
      background: radial-gradient(ellipse at 50% 38%, #54203d, #321329 48%, #210d1b 85%);
    }
    .decor { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .spark {
      position: absolute;
      color: #ffc5dc;
      opacity: .6;
      animation: twinkle 3s ease-in-out infinite;
    }
    .spark:nth-child(1) { top: 12%; left: 13%; font-size: 22px; }
    .spark:nth-child(2) { top: 22%; right: 14%; font-size: 18px; animation-delay: .8s; }
    .spark:nth-child(3) { bottom: 17%; left: 19%; font-size: 20px; animation-delay: 1.4s; }
    .spark:nth-child(4) { bottom: 23%; right: 17%; font-size: 24px; animation-delay: .4s; }
    .card {
      width: min(100%, 560px);
      text-align: center;
      padding: clamp(26px, 6vw, 48px);
      border: 1px solid rgba(255,190,216,.25);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(91,35,68,.82), rgba(42,17,36,.88));
      box-shadow: 0 24px 90px rgba(0,0,0,.3);
      backdrop-filter: blur(12px);
      z-index: 1;
    }
    .eyebrow {
      color: #ff8db8;
      text-transform: uppercase;
      letter-spacing: .2em;
      font-size: 11px;
      font-weight: 700;
    }
    .heart-wrap { height: 190px; display: grid; place-items: center; margin: 12px auto; }
    .heart {
      width: 145px;
      height: 145px;
      filter: drop-shadow(0 0 16px rgba(255,71,126,.6));
      transform-origin: center;
      animation: heartbeat 1.25s ease-in-out infinite;
    }
    h1 {
      font-family: Georgia, serif;
      font-size: clamp(29px, 7vw, 42px);
      line-height: 1.2;
      font-weight: 500;
      margin: 12px 0;
      color: #fff1f7;
    }
    .subtitle { color: #e8bfd0; font-size: 14px; line-height: 1.7; max-width: 390px; margin: auto; }
    .message-box {
      min-height: 116px;
      display: grid;
      place-items: center;
      margin: 26px 0 20px;
      padding: 20px;
      border-radius: 18px;
      background: rgba(255,190,216,.09);
      border: 1px solid rgba(255,190,216,.18);
    }
    .message {
      color: #ffe1ed;
      font-family: Georgia, serif;
      font-size: clamp(18px, 4.5vw, 22px);
      line-height: 1.55;
      white-space: pre-line;
      animation: appear .7s ease both;
    }
    .signature { color: #ff9fc2; font-size: 13px; margin: 0 0 24px; }
    button {
      border: 0;
      border-radius: 999px;
      padding: 14px 23px;
      min-height: 48px;
      background: #d94f83;
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(217,79,131,.25);
    }
    button:hover { filter: brightness(1.1); transform: translateY(-2px); }
    button:focus-visible { outline: 3px solid #ffd2e4; outline-offset: 4px; }
    .hint { color: #c99caf; font-size: 11px; margin: 18px 0 0; }
    .floating {
      position: absolute;
      bottom: -30px;
      color: #ff8db8;
      opacity: 0;
      pointer-events: none;
      animation: floatUp 5s linear forwards;
      z-index: 2;
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      12% { transform: scale(1.12); }
      24% { transform: scale(1); }
      38% { transform: scale(1.17); }
      52% { transform: scale(1); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: .22; transform: scale(.85); }
      50% { opacity: .9; transform: scale(1.2); }
    }
    @keyframes appear {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0); opacity: 0; }
      12% { opacity: .75; }
      100% { transform: translateY(-110vh) rotate(28deg); opacity: 0; }
    }
    @media (max-width: 420px) {
      .heart-wrap { height: 160px; }
      .heart { width: 124px; height: 124px; }
      .card { padding: 28px 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="decor" aria-hidden="true">
      <span class="spark">✦</span>
      <span class="spark">♡</span>
      <span class="spark">✧</span>
      <span class="spark">✦</span>
    </div>

    <section class="card">
      <div class="eyebrow">MỘT MÓN QUÀ NHỎ SAU TRÒ CHƠI</div>

      <div class="heart-wrap" aria-hidden="true">
        <svg class="heart" viewBox="0 0 200 185">
          <defs>
            <linearGradient id="heartFill" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ff9fc5"/>
              <stop offset="48%" stop-color="#ff477e"/>
              <stop offset="100%" stop-color="#c91855"/>
            </linearGradient>
          </defs>
          <path d="M100 174 C83 158 13 108 13 57 C13 5 79 -5 100 39 C121 -5 187 5 187 57 C187 108 117 158 100 174 Z"
                fill="url(#heartFill)" stroke="#ffb2ce" stroke-width="1.5"/>
        </svg>
      </div>

      <h1>Gửi bạn một lời chúc nhỏ</h1>
      <p class="subtitle">
        Hãy nhận một lời chúc thật vui và mang theo nó nhé.
      </p>

      <div class="message-box" aria-live="polite">
        <div class="message" id="message">Đang chọn một lời chúc dành cho bạn...</div>
      </div>

      <p class="signature">— Gửi lớp Tin 11 - THPT Chuyên Thái Nguyên ♡</p>
      <button id="change" type="button">Đổi lời chúc khác ♡</button>
      <p class="hint" id="hint">Bạn chỉ được đổi lời chúc 1 lần thôi nhé.</p>
    </section>
  </main>

  <script>
    // Danh sách lời chúc. Bạn có thể sửa nội dung trong dấu ngoặc kép.
    const wishes = [
      "Chúc bạn luôn học tốt, tự tin và đạt được những kết quả thật đáng tự hào nhé!",
      "Chúc bạn luôn giữ được sự tò mò, tinh thần ham học hỏi và dũng khí thử những điều mới mẻ.",
      "Mong mỗi ngày đến trường của bạn đều có thêm niềm vui, tiếng cười và những người bạn tốt.",
      "Dù có lúc bài vở hơi khó, hãy kiên trì từng chút một nhé. Bạn làm được nhiều hơn mình nghĩ đấy!",
      "Chúc bạn có một tuổi học trò thật rực rỡ, nhiều kỷ niệm đẹp và luôn can đảm theo đuổi ước mơ.",
      "Chúc bạn may mắn lần sau!"
    ];

    // Mỗi máy nhận 1 lời chúc và được đổi đúng 1 lần.
    // Lời chúc và lượt đổi được lưu lại, nên quét lại mã QR
    // hoặc tải lại trang vẫn hiện đúng lời chúc cũ.
    const INDEX_KEY = "loi_chuc_qr_index";
    const CHANGED_KEY = "loi_chuc_qr_da_doi";

    const messageEl = document.getElementById("message");
    const changeBtn = document.getElementById("change");
    const hintEl = document.getElementById("hint");

    function load(key) {
      try { return localStorage.getItem(key); } catch (e) { return null; }
    }

    function save(key, value) {
      try { localStorage.setItem(key, value); } catch (e) {}
    }

    // Chọn ngẫu nhiên 1 lời chúc, khác với lời chúc đang có (nếu có).
    function randomIndex(exceptIndex) {
      let index;
      do {
        index = Math.floor(Math.random() * wishes.length);
      } while (wishes.length > 1 && index === exceptIndex);
      return index;
    }

    function showWish(index) {
      messageEl.style.animation = "none";
      void messageEl.offsetWidth;
      messageEl.textContent = wishes[index];
      messageEl.style.animation = "appear .7s ease both";

      // Tạo vài trái tim nhỏ bay lên khi hiện lời chúc.
      for (let i = 0; i < 4; i++) {
        createFloatingHeart();
      }
    }

    function lockChangeButton() {
      changeBtn.hidden = true;
      hintEl.textContent = "Bạn đã dùng lượt đổi lời chúc rồi nhé.";
    }

    function createFloatingHeart() {
      const heart = document.createElement("span");
      heart.className = "floating";
      heart.textContent = Math.random() > 0.5 ? "♡" : "♥";
      heart.style.left = (10 + Math.random() * 80) + "vw";
      heart.style.fontSize = (13 + Math.random() * 17) + "px";
      heart.style.animationDuration = (4 + Math.random() * 2) + "s";

      document.querySelector(".app").appendChild(heart);
      heart.addEventListener("animationend", () => heart.remove());
    }

    // Lấy lời chúc đã lưu, nếu chưa có thì chọn mới.
    let currentIndex = parseInt(load(INDEX_KEY), 10);
    if (!(currentIndex >= 0 && currentIndex < wishes.length)) {
      currentIndex = randomIndex(-1);
      save(INDEX_KEY, String(currentIndex));
    }

    showWish(currentIndex);

    if (load(CHANGED_KEY) === "1") {
      lockChangeButton();
    }

    // Nút đổi lời chúc: chỉ dùng được 1 lần.
    changeBtn.addEventListener("click", () => {
      if (load(CHANGED_KEY) === "1") {
        lockChangeButton();
        return;
      }

      currentIndex = randomIndex(currentIndex);
      save(INDEX_KEY, String(currentIndex));
      save(CHANGED_KEY, "1");

      showWish(currentIndex);
      lockChangeButton();
    });
  </script>
</body>
</html>
